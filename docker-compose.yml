services:
  # 1. SERVER DATABASE
  mysql-server:
    image: mysql:8.0
    container_name: MySQL-API
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: API_ujikom
      MYSQL_USER: api_ujikom
      MYSQL_PASSWORD: api_ujikom
      MYSQL_ROOT_PASSWORD: api_ujikom
    ports:
      - "3306:3306"
    networks:
      - API-UJIKOM
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-papi_ujikom"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. SERVER BACKEND (LARAVEL)
  app-laravel:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: laravel-api
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
    # Tunggu MySQL sehat dulu, lalu install deps, generate key, migrate, baru serve
    command: >
      sh -c "
        composer install --no-interaction --prefer-dist --optimize-autoloader &&
        php artisan key:generate --no-interaction &&
        php artisan migrate --force --no-interaction &&
        php artisan serve --host=0.0.0.0 --port=8000
      "
    depends_on:
      mysql-server:
        condition: service_healthy
    networks:
      - API-UJIKOM

  # 3. SERVER UI DATABASE (PHPMYADMIN)
  phpMyadmin:
    image: phpmyadmin
    container_name: PhpMyadmin-API
    restart: unless-stopped
    environment:
      PMA_HOST: mysql-server
    ports:
      - "8081:80"
    depends_on:
      - mysql-server
    networks:
      - API-UJIKOM

volumes:
  db_data:

networks:
  API-UJIKOM:
    driver: bridge


